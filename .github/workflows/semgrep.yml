name: Semgrep

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - ".semgrep/**"
      - ".semgrepignore"
      - ".github/workflows/semgrep.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - ".semgrep/**"
      - ".semgrepignore"
      - ".github/workflows/semgrep.yml"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      # Pinned by hand by tag and digest, which move together; `just outdated`
      # shows the latest release and the pin to use.
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Rule tests: each `.semgrep/<rule>.go` fixture marks the findings its
      # rule must report (`// ruleid:`) and must not report (`// ok:`).
      - run: semgrep --test --metrics=off .semgrep/

      # The fixtures contain findings on purpose, so the scan skips them.
      - run: semgrep scan --config=.semgrep --config=p/golang --config=p/gosec --exclude=.semgrep --sarif --output=semgrep.sarif --error --metrics=off

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
