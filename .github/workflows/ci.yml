name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
      - '.golangci.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
      - '.golangci.yml'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tools pinned by hand and bumped when upgrading dependencies; `just outdated`
# shows the latest releases (CONTRIBUTING.md: Updating dependencies). The
# govulncheck and go-licenses versions in the jobs below are pinned the same
# way, together with vuln-schedule.yml and .goreleaser.yaml.
env:
  # Keep it at the version of the dev shell, which takes golangci-lint from
  # nixpkgs (a nixpkgs bump can move it), or CI and `just lint` lint with
  # different rules.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage (services)
        run: |
          go test ./internal/services/... -coverprofile=svc_coverage.out -covermode=atomic
          total=$(go tool cover -func=svc_coverage.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Service coverage: ${total}%"
          awk "BEGIN { if ($total+0 < 80) { print \"Service coverage \" $total \"% is below 80% threshold\"; exit 1 } }" <<< "$total"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810  # v1.2.2
        with:
          run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810  # v1.2.2
        with:
          run: >
            go run github.com/google/go-licenses/v2@v2.0.1 check github.com/tbckr/trident/... \
              --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,GPL-3.0,GPL-3.0-only

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086  # v31.11.5

      - name: Flake check
        run: nix flake check
