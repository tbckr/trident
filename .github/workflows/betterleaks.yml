name: Betterleaks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: betterleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: ghcr.io/betterleaks/betterleaks:v1.6.1@sha256:7a43a20d40be02a9c13801a6485f7bea9d9cdba512263440eae972103c5291f1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so 'betterleaks git .' can scan all commits

      # Container runs as root but $GITHUB_WORKSPACE is bind-mounted with the
      # runner UID, so git fails with "dubious ownership" (CVE-2022-24765).
      # safe.directory via git config does not work here because betterleaks
      # spawns git with a cleared environment (no HOME → no global/system
      # config is read). The reliable fix is to align ownership with the
      # container user before scanning.
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - run: betterleaks git . --report-format=sarif --report-path=betterleaks.sarif --redact --no-banner

      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        if: always()
        with:
          sarif_file: betterleaks.sarif
