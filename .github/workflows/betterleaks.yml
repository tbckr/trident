name: Betterleaks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: betterleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      # Pinned by hand by tag and digest, which move together; `just outdated`
      # shows the latest release and the pin to use.
      image: ghcr.io/betterleaks/betterleaks:v1.10.1@sha256:f345c1ac502abc51ec334c3d815ad18a79fb1509555fc4496b2cb88e760681b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so 'betterleaks git .' can scan all commits

      # Container runs as root but $GITHUB_WORKSPACE is bind-mounted with the
      # runner UID, so git fails with "dubious ownership" (CVE-2022-24765).
      # safe.directory via git config does not work here because betterleaks
      # runs git with GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM set to /dev/null,
      # so no global/system config is read. The reliable fix is to align
      # ownership with the container user before scanning.
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - run: betterleaks git . --config=.betterleaks.toml --report-format=sarif --report-path=betterleaks.sarif --redact --no-banner

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: betterleaks.sarif
