name: Scheduled Vulnerability Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache: false

      # govulncheck is pinned by hand, together with ci.yml and .goreleaser.yaml
      # (`just outdated` shows the latest release).
      - uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810  # v1.2.2
        with:
          run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
