rules:
  - id: trident-req-proxy-safe-transport
    languages: [go]
    severity: ERROR
    message: >-
      Don't change the HTTP version, the dialer, the transport or the proxy of
      a `*req.Client` outside `internal/httpclient`. `httpclient.New` and
      `httpclient.NewDoH` set all of these so that traffic cannot leave the
      configured proxy: req ignores the proxy on its HTTP/2 paths (forced
      HTTP/2: imroc/req#206; a redial after a proxied HTTP/2 connection died:
      imroc/req#541), so behind a proxy req's transport is forced to HTTP/1.1,
      and a dial guard (`guardProxyBypass`) refuses direct connections with
      `apperr.ErrProxyBypass`. The DoH clients (`httpclient.NewDoH`: quad9,
      apex) need HTTP/2, so their requests run on a stdlib `net/http`
      transport instead, which speaks HTTP/2 through the proxy without leaving
      it, behind the same guard; req's own transport stays configured as
      `httpclient.New` leaves it (proxied, guarded, HTTP/1.1 behind a proxy)
      and is only the fallback. `EnableForceHTTP2` re-enables the leaking path
      (the guard then fails every request), HTTP/3 is QUIC over UDP and
      bypasses both the proxy and the guard, and
      `SetDial`/`SetDialTLS`/`SetProxy`/`SetProxyURL` (and `SetResolver`,
      `SetHosts`, `SetUnixSocket`, which call `SetDial` internally, or
      assigning the transport's `DialContext`/`DialTLSContext`/`Proxy`)
      replace the guard or desynchronise it from the proxy. Assigning
      `GetClient().Transport` replaces the guarded transport outright, and
      `Clone()` and `RoundTrip` on a `*req.Client` run on req's fallback
      transport, so a DoH client loses its HTTP/2, timeouts and health checks
      (Quad9 then answers 505). Get clients from the deps factories
      (`d.newHTTPClient()`, `d.newDoHClient()`). If a command really needs
      anything else here, change `internal/httpclient` and its proxy tests
      (proxy_test.go, doh_test.go) instead.
    metadata:
      category: security
      confidence: HIGH
    paths:
      exclude:
        - "/internal/httpclient/"
    pattern-either:
      - pattern: $C.EnableForceHTTP2()
      - pattern: $C.EnableForceHTTP3()
      - pattern: $C.EnableHTTP3()
      - pattern: $C.EnableH2C()
      - pattern: $C.DisableForceHttpVersion()
      - pattern: $C.SetDial(...)
      - pattern: $C.SetDialTLS(...)
      - pattern: $C.SetProxy(...)
      - pattern: $C.SetProxyURL(...)
      - pattern: $C.SetResolver(...)
      - pattern: $C.SetHosts(...)
      - pattern: $C.SetUnixSocket(...)
      - pattern: $T.DialContext = $X
      - pattern: $T.DialTLSContext = $X
      - pattern: $T.Proxy = $X
      - pattern: $C.GetClient().Transport = $X
      - pattern: '($C : *req.Client).Clone()'
      - pattern: '($C : *req.Client).RoundTrip(...)'
      - pattern: $C.GetTransport().RoundTrip(...)
