rules:
  - id: trident-no-direct-httpclient-new
    languages: [go]
    severity: ERROR
    message: >-
      Don't call `httpclient.New(...)` or `httpclient.NewDoH(...)` from command
      or service code. Use the deps factories `d.newHTTPClient()` and
      `d.newDoHClient()` so proxy, user-agent, and logging stay consistent
      across the binary. The only legitimate direct callers are
      `internal/cli/deps.go` (the factories themselves) and
      `internal/httpclient/*_test.go`.
    metadata:
      category: convention
      confidence: HIGH
    paths:
      exclude:
        - "/internal/cli/deps.go"
        - "/internal/httpclient/*_test.go"
    pattern-either:
      - pattern: httpclient.New(...)
      - pattern: httpclient.NewDoH(...)
